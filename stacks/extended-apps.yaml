# Only Apple-documented disposable bundle cache namespaces; never profiles or VM disks.
# https://developer.apple.com/library/archive/documentation/FileManagement/Conceptual/FileSystemProgrammingGuide/MacOSXDirectories/MacOSXDirectories.html
stack:
  id: extended-apps
  name:
    en: Application caches
    pt-BR: Caches de aplicativos
    es: Cachés de aplicaciones
  icon: app
  order: 810
storage:
  - id: app-cache-safari
    name: "Safari — cache"
    description:
      en: "Disposable cache namespace only. Close the application first. Documents, sessions, databases and virtual machines are preserved."
      pt-BR: "Somente a pasta de cache descartável. Feche o aplicativo. Documentos, sessões, bancos de dados e máquinas virtuais são preservados."
      es: "Solo la carpeta de caché descartable. Cierra la aplicación. Se preservan documentos, sesiones, bases de datos y máquinas virtuales."
    risk: redownload
    method: trash
    auto_suggest: false
    requires_apps_closed: ["com.apple.Safari"]
    paths:
      - "~/Library/Caches/com.apple.Safari"
      - "~/Library/Containers/com.apple.Safari/Data/Library/Caches/com.apple.Safari"
