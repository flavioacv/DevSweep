# Cache locations verified against the official source linked before each entry.
stack:
  id: extended-tools
  name:
    en: Development caches
    pt-BR: Caches de desenvolvimento
    es: Cachés de desarrollo
  icon: hammer
  order: 800
storage:
  # https://pip.pypa.io/en/stable/topics/caching/
  - id: python-pip
    name: "pip"
    description:
      en: "Manual cache review. Close the tool first; offline packages may need downloading again. Environments, installed tools and credentials are preserved."
      pt-BR: "Revisão manual de cache. Feche a ferramenta; pacotes offline podem precisar de novo download. Ambientes, ferramentas instaladas e credenciais são preservados."
      es: "Revisión manual de caché. Cierra la herramienta; los paquetes pueden necesitar descarga. Se preservan entornos, herramientas y credenciales."
    risk: redownload
    method: trash
    auto_suggest: false
    requires_tools_idle: ["pip", "python"]
    paths:
      - glob: "${PIP_CACHE_DIR:-~/Library/Caches/pip}"
        older_than_days: 7
  # https://docs.astral.sh/uv/concepts/cache/
  - id: python-uv
    name: "uv"
    description:
      en: "Manual cache review. Close the tool first; offline packages may need downloading again. Environments, installed tools and credentials are preserved."
      pt-BR: "Revisão manual de cache. Feche a ferramenta; pacotes offline podem precisar de novo download. Ambientes, ferramentas instaladas e credenciais são preservados."
      es: "Revisión manual de caché. Cierra la herramienta; los paquetes pueden necesitar descarga. Se preservan entornos, herramientas y credenciales."
    risk: redownload
    method: trash
    auto_suggest: false
    requires_tools_idle: ["uv", "python"]
    paths:
      - glob: "${UV_CACHE_DIR:-~/.cache/uv}"
        older_than_days: 7
  # https://docs.conda.io/projects/conda/en/stable/commands/clean.html
  - id: python-conda-tarballs
    name: "Conda package archives"
    description:
      en: "Manual cache review. Close the tool first; offline packages may need downloading again. Environments, installed tools and credentials are preserved."
      pt-BR: "Revisão manual de cache. Feche a ferramenta; pacotes offline podem precisar de novo download. Ambientes, ferramentas instaladas e credenciais são preservados."
      es: "Revisión manual de caché. Cierra la herramienta; los paquetes pueden necesitar descarga. Se preservan entornos, herramientas y credenciales."
    risk: redownload
    method: trash
    auto_suggest: false
    requires_tools_idle: ["conda", "python"]
    paths:
      - glob: "~/miniconda3/pkgs/*.conda"
        older_than_days: 7
        files_only: true
      - glob: "~/miniconda3/pkgs/*.tar.bz2"
        older_than_days: 7
        files_only: true
      - glob: "~/anaconda3/pkgs/*.conda"
        older_than_days: 7
        files_only: true
      - glob: "~/anaconda3/pkgs/*.tar.bz2"
        older_than_days: 7
        files_only: true
  # https://doc.rust-lang.org/cargo/guide/cargo-home.html
  - id: rust-cargo-archives
    name: "Cargo downloaded archives"
    description:
      en: "Manual cache review. Close the tool first; offline packages may need downloading again. Environments, installed tools and credentials are preserved."
      pt-BR: "Revisão manual de cache. Feche a ferramenta; pacotes offline podem precisar de novo download. Ambientes, ferramentas instaladas e credenciais são preservados."
      es: "Revisión manual de caché. Cierra la herramienta; los paquetes pueden necesitar descarga. Se preservan entornos, herramientas y credenciales."
    risk: redownload
    method: trash
    auto_suggest: false
    requires_tools_idle: ["cargo", "rustc"]
    paths:
      - glob: "${CARGO_HOME:-~/.cargo}/registry/cache/*/*.crate"
        older_than_days: 7
        files_only: true
  # https://getcomposer.org/doc/06-config.md#cache-dir
  - id: php-composer
    name: "Composer"
    description:
      en: "Manual cache review. Close the tool first; offline packages may need downloading again. Environments, installed tools and credentials are preserved."
      pt-BR: "Revisão manual de cache. Feche a ferramenta; pacotes offline podem precisar de novo download. Ambientes, ferramentas instaladas e credenciais são preservados."
      es: "Revisión manual de caché. Cierra la herramienta; los paquetes pueden necesitar descarga. Se preservan entornos, herramientas y credenciales."
    risk: redownload
    method: trash
    auto_suggest: false
    requires_tools_idle: ["composer", "php"]
    paths:
      - glob: "${COMPOSER_CACHE_DIR:-~/Library/Caches/composer}"
        older_than_days: 7
  # https://ccache.dev/manual/latest.html
  - id: compiler-ccache
    name: "ccache"
    description:
      en: "Manual cache review. Close the tool first; offline packages may need downloading again. Environments, installed tools and credentials are preserved."
      pt-BR: "Revisão manual de cache. Feche a ferramenta; pacotes offline podem precisar de novo download. Ambientes, ferramentas instaladas e credenciais são preservados."
      es: "Revisión manual de caché. Cierra la herramienta; los paquetes pueden necesitar descarga. Se preservan entornos, herramientas y credenciales."
    risk: redownload
    method: trash
    auto_suggest: false
    requires_tools_idle: ["ccache", "clang", "gcc", "make", "ninja"]
    paths:
      - glob: "${CCACHE_DIR:-~/Library/Caches/ccache}"
        older_than_days: 7
  # https://mise.jdx.dev/directories.html
  - id: tools-mise
    name: "mise"
    description:
      en: "Manual cache review. Close the tool first; offline packages may need downloading again. Environments, installed tools and credentials are preserved."
      pt-BR: "Revisão manual de cache. Feche a ferramenta; pacotes offline podem precisar de novo download. Ambientes, ferramentas instaladas e credenciais são preservados."
      es: "Revisión manual de caché. Cierra la herramienta; los paquetes pueden necesitar descarga. Se preservan entornos, herramientas y credenciales."
    risk: redownload
    method: trash
    auto_suggest: false
    requires_tools_idle: ["mise"]
    paths:
      - glob: "${MISE_CACHE_DIR:-~/Library/Caches/mise}"
        older_than_days: 7
  # https://pre-commit.com/#managing-ci-caches
  - id: tools-precommit
    name: "pre-commit"
    description:
      en: "Manual cache review. Close the tool first; offline packages may need downloading again. Environments, installed tools and credentials are preserved."
      pt-BR: "Revisão manual de cache. Feche a ferramenta; pacotes offline podem precisar de novo download. Ambientes, ferramentas instaladas e credenciais são preservados."
      es: "Revisión manual de caché. Cierra la herramienta; los paquetes pueden necesitar descarga. Se preservan entornos, herramientas y credenciales."
    risk: redownload
    method: trash
    auto_suggest: false
    requires_tools_idle: ["pre-commit", "python", "git"]
    paths:
      - glob: "${PRE_COMMIT_HOME:-~/.cache/pre-commit}"
        older_than_days: 7
  # https://developer.hashicorp.com/terraform/cli/config/config-file#provider-plugin-cache
  - id: infra-terraform
    name: "Terraform provider downloads"
    description:
      en: "Manual cache review. Close the tool first; offline packages may need downloading again. Environments, installed tools and credentials are preserved."
      pt-BR: "Revisão manual de cache. Feche a ferramenta; pacotes offline podem precisar de novo download. Ambientes, ferramentas instaladas e credenciais são preservados."
      es: "Revisión manual de caché. Cierra la herramienta; los paquetes pueden necesitar descarga. Se preservan entornos, herramientas y credenciales."
