# User-scoped Mac cleanup. Never select entire browser or application profiles.
# Cache layout: https://chromium.googlesource.com/chromium/src/+/HEAD/docs/user_data_dir.md
# Electron cache folders: https://www.electronjs.org/docs/latest/api/app/
# Firefox profiles: https://firefox-source-docs.mozilla.org/toolkit/profile/index.html
# Firefox HTTP cache: https://firefox-source-docs.mozilla.org/networking/cache2/doc.html
# Discord cache: https://support.discord.com/hc/en-us/articles/31623498041623-Discord-Troubleshooting-Guide
# Discord logs: https://support.discord.com/hc/en-us/articles/1500006052822-How-to-Report-a-Bug
# Zoom logs: https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0060047
stack:
  id: mac
  name: Mac
  icon: desktopcomputer
  order: 900

storage:
  - id: mac-chrome-cache
    name:
      en: Google Chrome disk cache
      pt-BR: Cache de disco do Google Chrome
      es: Caché de disco de Google Chrome
    description:
      en: "Cached web resources from standard profiles. Close Chrome first. Pages download resources again; cookies, passwords and history are kept."
      pt-BR: "Recursos web em cache dos perfis padrão. Feche o Chrome antes. As páginas baixam os recursos novamente; cookies, senhas e histórico são preservados."
      es: "Recursos web en caché de perfiles estándar. Cierra Chrome primero. Las páginas descargan los recursos otra vez; se conservan cookies, contraseñas e historial."
    risk: redownload
    auto_suggest: false
    requires_apps_closed: [com.google.Chrome, com.google.Chrome.beta, com.google.Chrome.dev, com.google.Chrome.canary]
    paths:
      - ~/Library/Caches/Google/Chrome/{Default,Profile *,Guest Profile}/Cache

  - id: mac-chromium-cache
    name:
      en: Chromium disk cache
      pt-BR: Cache de disco do Chromium
      es: Caché de disco de Chromium
    description:
      en: "Cached web resources from standard profiles. Close Chromium first. Profile data is kept; resources download again."
      pt-BR: "Recursos web em cache dos perfis padrão. Feche o Chromium antes. Os dados dos perfis são preservados; os recursos serão baixados novamente."
      es: "Recursos web en caché de perfiles estándar. Cierra Chromium primero. Se conservan los datos de los perfiles; los recursos se descargan otra vez."
    risk: redownload
    auto_suggest: false
    requires_apps_closed: [org.chromium.Chromium]
    paths:
      - ~/Library/Caches/Chromium/{Default,Profile *,Guest Profile}/Cache

  - id: mac-edge-cache
    name:
      en: Microsoft Edge disk cache
      pt-BR: Cache de disco do Microsoft Edge
      es: Caché de disco de Microsoft Edge
    description:
      en: "Cached web resources from standard profiles. Close Edge first. Profile data is kept; resources download again."
      pt-BR: "Recursos web em cache dos perfis padrão. Feche o Edge antes. Os dados dos perfis são preservados; os recursos serão baixados novamente."
      es: "Recursos web en caché de perfiles estándar. Cierra Edge primero. Se conservan los datos de los perfiles; los recursos se descargan otra vez."
    risk: redownload
    auto_suggest: false
    requires_apps_closed: [com.microsoft.edgemac, com.microsoft.edgemac.Beta, com.microsoft.edgemac.Dev, com.microsoft.edgemac.Canary]
    paths:
      - ~/Library/Caches/Microsoft Edge/{Default,Profile *,Guest Profile}/Cache

  - id: mac-brave-cache
    name:
      en: Brave disk cache
      pt-BR: Cache de disco do Brave
      es: Caché de disco de Brave
    description:
      en: "Cached web resources from standard profiles. Close Brave first. Profile data is kept; resources download again."
      pt-BR: "Recursos web em cache dos perfis padrão. Feche o Brave antes. Os dados dos perfis são preservados; os recursos serão baixados novamente."
      es: "Recursos web en caché de perfiles estándar. Cierra Brave primero. Se conservan los datos de los perfiles; los recursos se descargan otra vez."
    risk: redownload
    auto_suggest: false
    requires_apps_closed: [com.brave.Browser, com.brave.Browser.beta, com.brave.Browser.nightly]
    paths:
      - ~/Library/Caches/BraveSoftware/Brave-Browser/{Default,Profile *,Guest Profile}/Cache

  - id: mac-slack-cache
    name:
      en: Slack web and rendering caches
      pt-BR: Caches web e de renderização do Slack
      es: Cachés web y de renderizado de Slack
    description:
      en: "Close Slack first. Only Cache, Code Cache and GPUCache are removed. Sessions, local storage and workspaces are kept; resources download again."
      pt-BR: "Feche o Slack antes. Remove apenas Cache, Code Cache e GPUCache. Sessões, armazenamento local e espaços de trabalho são preservados; os recursos serão baixados novamente."
      es: "Cierra Slack primero. Solo elimina Cache, Code Cache y GPUCache. Se conservan sesiones, almacenamiento local y espacios de trabajo; los recursos se descargan otra vez."
    risk: redownload
    auto_suggest: false
    requires_apps_closed: [com.tinyspeck.slackmacgap]
    paths:
      - ~/Library/Application Support/Slack/{Cache,Code Cache,GPUCache}
      - ~/Library/Containers/com.tinyspeck.slackmacgap/Data/Library/Application Support/Slack/{Cache,Code Cache,GPUCache}

  - id: mac-slack-old-logs
    name:
      en: Slack logs older than 30 days
      pt-BR: Logs do Slack com mais de 30 dias
      es: Registros de Slack de más de 30 días
    description:
      en: "Moves old .log files to Trash after Slack closes. These are historical diagnostics: review before removing. Recent and open files are kept."
      pt-BR: "Move arquivos .log antigos para a Lixeira após fechar o Slack. São diagnósticos históricos: revise antes de remover. Arquivos recentes e abertos são preservados."
      es: "Mueve archivos .log antiguos a la Papelera después de cerrar Slack. Son diagnósticos históricos: revisa antes de eliminar. Se conservan archivos recientes y abiertos."
    risk: data_loss
    auto_suggest: false
    method: trash
    requires_apps_closed: [com.tinyspeck.slackmacgap]
    paths:
      - glob: ~/Library/Application Support/Slack/logs/*.log
        files_only: true
        older_than_days: 30
      - glob: ~/Library/Containers/com.tinyspeck.slackmacgap/Data/Library/Application Support/Slack/logs/*.log
        files_only: true
        older_than_days: 30

  - id: mac-old-crash-reports
    name:
      en: Crash reports older than 30 days
      pt-BR: Relatórios de falhas com mais de 30 dias
      es: Informes de fallos de más de 30 días
    description:
      en: "Moves old user .ips, .crash, .hang and .spin reports to Trash. Historical diagnostics are not regenerated: review before removing. Recent and open reports are kept."
      pt-BR: "Move relatórios .ips, .crash, .hang e .spin antigos do usuário para a Lixeira. Os diagnósticos históricos não são regenerados: revise antes de remover. Relatórios recentes e abertos são preservados."
      es: "Mueve informes .ips, .crash, .hang y .spin antiguos del usuario a la Papelera. Los diagnósticos históricos no se regeneran: revisa antes de eliminar. Se conservan informes recientes y abiertos."
    risk: data_loss
    auto_suggest: false
    method: trash
    paths:
      - glob: ~/Library/Logs/DiagnosticReports/*.{ips,crash,hang,spin}
        files_only: true
        older_than_days: 30

  - id: mac-firefox-cache
    name:
      en: Firefox HTTP cache
      pt-BR: Cache HTTP do Firefox
      es: Caché HTTP de Firefox
    description:
      en: "Only cache2 under standard local profiles. Close Firefox, Developer Edition and Nightly first. Cookies, saved passwords, bookmarks and profile settings are kept; web resources download again."
      pt-BR: "Apenas cache2 dos perfis locais padrão. Feche o Firefox, Developer Edition e Nightly antes. Cookies, senhas salvas, favoritos e configurações dos perfis são preservados; recursos web serão baixados novamente."
      es: "Solo cache2 de perfiles locales estándar. Cierra Firefox, Developer Edition y Nightly primero. Se conservan cookies, contraseñas guardadas, marcadores y ajustes; los recursos web se descargan otra vez."
    risk: redownload
    auto_suggest: false
    requires_apps_closed: [org.mozilla.firefox, org.mozilla.firefoxdeveloperedition, org.mozilla.nightly]
    paths:
      - ~/Library/Caches/Firefox/Profiles/*/cache2

  - id: mac-discord-cache
    name:
      en: Discord web and rendering caches
      pt-BR: Caches web e de renderização do Discord
      es: Cachés web y de renderizado de Discord
    description:
      en: "Close Discord and its test channels first. Only Cache, Code Cache and GPUCache in the standard Discord profile are removed. Sessions, settings, local storage and downloaded modules are kept."
      pt-BR: "Feche o Discord e seus canais de teste antes. Remove apenas Cache, Code Cache e GPUCache do perfil padrão do Discord. Sessões, configurações, armazenamento local e módulos baixados são preservados."
      es: "Cierra Discord y sus canales de prueba primero. Solo elimina Cache, Code Cache y GPUCache del perfil estándar de Discord. Se conservan sesiones, ajustes, almacenamiento local y módulos descargados."
    risk: redownload
    auto_suggest: false
    requires_apps_closed: [com.hnc.Discord, com.hnc.DiscordPTB, com.hnc.DiscordCanary]
    paths:
      - ~/Library/Application Support/discord/{Cache,Code Cache,GPUCache}

  - id: mac-discord-old-logs
    name:
      en: Discord logs older than 30 days
      pt-BR: Logs do Discord com mais de 30 dias
      es: Registros de Discord de más de 30 días
    description:
      en: "Moves old .log files in the standard Discord profile and its logs folder to Trash after Discord closes. Historical diagnostics cannot be regenerated; recent files, settings and downloaded modules are kept."
      pt-BR: "Move arquivos .log antigos do perfil padrão do Discord e da pasta logs para a Lixeira após fechar o Discord. Diagnósticos históricos não são regenerados; arquivos recentes, configurações e módulos baixados são preservados."
      es: "Mueve archivos .log antiguos del perfil estándar de Discord y su carpeta logs a la Papelera después de cerrar Discord. Los diagnósticos históricos no se regeneran; se conservan archivos recientes, ajustes y módulos descargados."
    risk: data_loss
    auto_suggest: false
    method: trash
    requires_apps_closed: [com.hnc.Discord, com.hnc.DiscordPTB, com.hnc.DiscordCanary]
    paths:
      - glob: ~/Library/Application Support/discord/*.log
        files_only: true
        older_than_days: 30
      - glob: ~/Library/Application Support/discord/logs/*.log
        files_only: true
        older_than_days: 30

  - id: mac-zoom-old-logs
    name:
      en: Zoom logs older than 30 days
      pt-BR: Logs do Zoom com mais de 30 dias
      es: Registros de Zoom de más de 30 días
    description:
      en: "Moves old .log files directly inside the user's zoom.us log folder to Trash after Zoom closes. Historical troubleshooting logs cannot be regenerated. Recordings, chat files, settings and system logs are kept."
      pt-BR: "Move arquivos .log antigos diretamente na pasta zoom.us de logs do usuário para a Lixeira após fechar o Zoom. Logs históricos de diagnóstico não são regenerados. Gravações, arquivos de chat, configurações e logs do sistema são preservados."
      es: "Mueve archivos .log antiguos directamente en la carpeta zoom.us de registros del usuario a la Papelera después de cerrar Zoom. Los registros históricos no se regeneran. Se conservan grabaciones, archivos de chat, ajustes y registros del sistema."
    risk: data_loss
    auto_suggest: false
    method: trash
    requires_apps_closed: [us.zoom.xos]
    paths:
      - glob: ~/Library/Logs/zoom.us/*.log
        files_only: true
        older_than_days: 30
